name: Apply Anzania finalization pass

on:
  push:
    branches:
      - agent/anzania-final-wow-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Reassemble and apply the prepared release patch
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/anzania-final-wow-pass.tar.gz"
          : > "$archive"
          for part in .agent/anzania.part.*.b64; do
            base64 --decode "$part" >> "$archive"
          done
          echo "70c90e4cac7facc8a40a9cfaccef8dffa56260c3b68adeec059359665d7c2fe6  $archive" | sha256sum --check --strict
          tar --list --gzip --file "$archive" >/dev/null
          tar --extract --gzip --file "$archive" --directory .
          rm -rf .agent
          sed -i 's/Cinematic 2.5D guided portfolio journey/Interactive 2.5D guided portfolio journey/' tests/unit/immersive/anzania-2-5d-runtime.test.ts
          sed -i 's/<script type="module" src={sitePath(/<script is:inline type="module" src={sitePath(/' src/pages/explore/index.astro

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for document generation
        run: pnpm exec playwright install --with-deps chromium

      - name: Format changed source files
        run: >-
          pnpm exec prettier --write
          src/pages/explore/index.astro
          src/pages/research/index.astro
          src/components/content/ExperienceRecord.astro
          tests/e2e/anzania-explorer.spec.ts
          tests/unit/immersive/anzania-2-5d-runtime.test.ts

      - name: Commit the completed implementation locally
        shell: bash
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement Anzania final wow pass"

      - name: Validate source and release build
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run check
          pnpm run test:immersive
          pnpm run build

      - name: Push validated implementation
        run: git push
