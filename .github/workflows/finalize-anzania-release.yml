name: Finalize and publish Explore Anzania

on:
  push:
    branches:
      - agent/anzania-ui-assets-stage
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zanzania-production-release
  cancel-in-progress: false

jobs:
  quality-and-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CHROME_PATH: /usr/bin/google-chrome
      RELEASE_REF: main
      RELEASE_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check out the staged release
        uses: actions/checkout@v6
        with:
          ref: agent/anzania-ui-assets-stage
          fetch-depth: 0

      - name: Install or confirm the verified production payload
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/anzania-ui-upgrade-payload.zip

          if test ! -f public/assets/immersive/anzania-explorer-v3.css || \
             test ! -f public/assets/immersive/characters/rendered/zuri.webp; then
            python -m pip install --disable-pip-version-check --quiet gdown
            gdown --id '1Wo475zXZwDPBiGxw5jF3yXPIYweezzFa' --output "$payload"
            actual_bytes="$(wc -c < "$payload" | tr -d ' ')"
            actual_sha="$(sha256sum "$payload" | awk '{print $1}')"
            test "$actual_bytes" = '469446'
            test "$actual_sha" = '3ac8452ca0bdaa23f7e4a7c63df43a8efea7c2002cdfdc81f659d5831472505e'
            unzip -t "$payload"
            rm -rf public/assets/immersive/characters
            mkdir -p public/assets/immersive/characters
            unzip -o "$payload" -d .
          fi

          rm -rf .payload
          rm -f .github/workflows/apply-anzania-ui-payload.yml
          rm -f .github/workflows/finalize-anzania-release.yml

          node --check public/assets/immersive/anzania-explorer.js
          node --check scripts/validate-public-output.mjs
          test "$(find public/assets/immersive/characters/rendered -type f -name '*.webp' | wc -l | tr -d ' ')" = '15'
          test -f public/assets/immersive/characters/rendered/amara.webp
          test -f public/assets/immersive/characters/rendered/amina.webp
          test -f public/assets/immersive/characters/rendered/elara.webp
          test -f public/assets/immersive/characters/rendered/ilya.webp
          test -f public/assets/immersive/characters/rendered/kian.webp
          test -f public/assets/immersive/characters/rendered/laila.webp
          test -f public/assets/immersive/characters/rendered/mateo.webp
          test -f public/assets/immersive/characters/rendered/nia.webp
          test -f public/assets/immersive/characters/rendered/omari.webp
          test -f public/assets/immersive/characters/rendered/rowan.webp
          test -f public/assets/immersive/characters/rendered/soren.webp
          test -f public/assets/immersive/characters/rendered/teboho.webp
          test -f public/assets/immersive/characters/rendered/tomas.webp
          test -f public/assets/immersive/characters/rendered/zahra.webp
          test -f public/assets/immersive/characters/rendered/zuri.webp

      - name: Create one clean publication commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare rendered guides and expanded Anzania workspace'
          release_tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch origin main
          git switch -C zanzania-publication origin/main
          git read-tree --reset -u "$release_tree"
          git commit -m 'Upgrade Explore Anzania characters and interface'
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtimes
        run: pnpm exec playwright install --with-deps chrome chromium firefox webkit

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint source
        run: pnpm run lint

      - name: Check Astro and TypeScript
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Build production release
        run: pnpm run build

      - name: Run browser journeys
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:e2e 2>&1 | tee playwright-e2e.log

      - name: Verify Lighthouse budgets
        run: pnpm run verify:lighthouse

      - name: Verify the release tree stayed clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish the tested commit to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the tested GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zanzania-release-failure-evidence
          path: |
            playwright-e2e.log
            playwright-report
            test-results
            AI-COLLAB/.watch-state/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: quality-and-publish
    steps:
      - name: Deploy the exact tested artifact
        id: deployment
        uses: actions/deploy-pages@v5
