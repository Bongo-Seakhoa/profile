name: Apply Anzania UI payload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-anzania-ui-payload
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          ref: agent/anzania-ui-assets-stage
          fetch-depth: 0

      - name: Reconstruct and validate the production payload
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/chunk-*.b64 | base64 --decode > /tmp/anzania-ui-upgrade-payload.zip
          test "$(wc -c < /tmp/anzania-ui-upgrade-payload.zip)" -eq 469446
          printf '%s  %s\n' '3ac8452ca0bdaa23f7e4a7c63df43a8efea7c2002cdfdc81f659d5831472505e' '/tmp/anzania-ui-upgrade-payload.zip' | sha256sum --check
          unzip -t /tmp/anzania-ui-upgrade-payload.zip

      - name: Apply interface and rendered character assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/assets/immersive/characters
          mkdir -p public/assets/immersive/characters
          unzip -o /tmp/anzania-ui-upgrade-payload.zip -d .
          rm -rf .payload
          rm -f .github/workflows/apply-anzania-ui-payload.yml
          node --check public/assets/immersive/anzania-explorer.js
          node --check scripts/validate-public-output.mjs
          test "$(find public/assets/immersive/characters/rendered -type f -name '*.webp' | wc -l)" -eq 15

      - name: Commit the production upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install rendered guides and deepen Explore Anzania UI'
          git push origin HEAD:agent/anzania-ui-assets-stage
