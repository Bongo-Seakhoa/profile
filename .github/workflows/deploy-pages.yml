name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CHROME_PATH: /usr/bin/google-chrome
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtimes
        run: pnpm exec playwright install --with-deps chrome chromium firefox webkit

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint source
        run: pnpm run lint

      - name: Check Astro and TypeScript
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Build production release
        run: pnpm run build

      - name: Run browser journeys
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm run test:e2e 2>&1 | tee playwright-e2e.log; then
            {
              echo "## Playwright browser-journey failure"
              echo
              echo '```text'
              tail -n 240 playwright-e2e.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            playwright-e2e.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Lighthouse budgets
        run: pnpm run verify:lighthouse

      - name: Upload Lighthouse failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-failure-report
          path: AI-COLLAB/.watch-state/lighthouse
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
