name: Apply compact guide clearance patch

on:
  push:
    branches:
      - agent/anzania-final-wow-pass

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the upgrade branch
        uses: actions/checkout@v6
        with:
          ref: agent/anzania-final-wow-pass
          fetch-depth: 0

      - name: Restore the governed stylesheet and apply the compact-height fix
        shell: bash
        run: |
          set -euo pipefail
          stylesheet="public/assets/immersive/anzania-explorer-v2.css"
          temporary_base="public/assets/immersive/anzania-explorer-v2-base.css"

          if [[ -f "$temporary_base" ]]; then
            cp "$temporary_base" "$stylesheet"
            rm "$temporary_base"
          fi

          if ! grep -q "Pixel 5 and similarly short portrait viewports" "$stylesheet"; then
            cat >> "$stylesheet" <<'EOF'

          /* Pixel 5 and similarly short portrait viewports need a little more stage
             above the dossier so the enlarged full-body guide and its complete caption
             retain the authored clearance contract. The dossier remains scrollable. */
          @media (max-width: 520px) and (min-height: 650px) and (max-height: 780px) {
            .chapter-panel {
              max-height: 48dvh;
            }

            .chapter-panel[data-mode="inner"] {
              max-height: 50dvh;
            }
          }
          EOF
          fi

          rm -f .github/workflows/apply-compact-clearance.yml

      - name: Commit the final in-place correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply compact guide clearance fix"
          git push origin HEAD:agent/anzania-final-wow-pass
