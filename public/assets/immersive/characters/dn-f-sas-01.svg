<g class="accessory" filter="url(#shadow)"><path fill="none" stroke="#4b3224" stroke-width="14" d="M287 383c87 120 96 282 35 407"/><path fill="#53243f" d="M315 681l92 15-15 115-96-12z"/><path fill="#f4cc72" d="M328 696l64 11-8 70-70-9z"/><path fill="none" stroke="#f6d788" stroke-width="7" d="M346 715h30M343 737h34"/></g>
<!-- foreground fabric tabs -->
<path fill="#8d3f6b" class="line" d="M198 651l44 18-31 319-63 63z"/>
<path fill="#d08a3d" class="line" d="M258 668l46-17 91 400-66-63z"/>
<path fill="#f4cc72" opacity=".78" d="M208 681l15 6-28 269-17 18zM278 682l15-6 65 287-18-18z"/>
<!-- dust flecks -->
<g fill="#f4cc72" opacity=".38"><circle cx="92" cy="1100" r="5"/><circle cx="116" cy="1073" r="3"/><circle cx="428" cy="1124" r="4"/><circle cx="451" cy="1089" r="6"/><circle cx="81" cy="1142" r="3"/></g>
</svg>