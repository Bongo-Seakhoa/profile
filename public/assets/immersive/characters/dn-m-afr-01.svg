<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1280" role="img" aria-labelledby="title desc">
<title id="title">Amani, an Anzania guide</title><desc id="desc">A polished full-body 2.5D character illustration with layered desert expedition clothing and transparent background.</desc>
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f3f2b"/><stop offset="1" stop-color="#4a281e"/></linearGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd5a36"/><stop offset=".55" stop-color="#713021"/><stop offset="1" stop-color="#1d1815"/></linearGradient>
  <linearGradient id="cloth2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1f5561"/><stop offset="1" stop-color="#182b2f"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b2"/><stop offset=".35" stop-color="#e8b967"/><stop offset="1" stop-color="#6d4a24"/></linearGradient>
  <radialGradient id="faceLight" cx="35%" cy="25%" r="75%"><stop stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#090706" flood-opacity=".45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="torsoClip"><path d="M77 371Q250 330 423 371L372 641Q250 670 128 641Z"/></clipPath>
  <style>
    .line{stroke:#251a16;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .fine{stroke:#2b1e18;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .pattern{fill:none;stroke:#e8b967;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  </style>
</defs>
<!-- grounding shadow and aura -->
<ellipse cx="254" cy="1210" rx="151" ry="34" fill="#0b0908" opacity=".42" filter="url(#soft)"/>
<path d="M116 1165c57-28 104-44 138-47 52-4 107 14 166 55-63-19-116-27-158-24-42 4-91 10-146 16z" fill="#e8b967" opacity=".13"/>
<!-- rear cape -->
<path filter="url(#shadow)" fill="#39271f" stroke="#201612" stroke-width="7" d="M87 392Q250 338 413 392L426 1002Q250 1088 74 1002Z"/>
<path fill="#fff" opacity=".07" d="M109 418Q250 374 401 414L388 942Q250 1022 102 950Z"/>
<!-- legs -->
<g filter="url(#shadow)">
  <path fill="url(#cloth2)" class="line" d="M138 809L224 809 234 1137 150 1137 170 797Z"/>
  <path fill="url(#cloth2)" class="line" d="M276 809L362 809 342 1137 258 1137Z"/>
  <path fill="#2a211b" class="line" d="M142 1111l97 2 6 78-129 0q-12-32 26-80z"/>
  <path fill="#2a211b" class="line" d="M257 1113l96-2q39 46 27 80H251z"/>
  <path fill="#e8b967" opacity=".7" d="M134 1152h109v15H127zM258 1152h112l7 15H258z"/>
</g>
<!-- arms -->
<g filter="url(#shadow)">
  <path fill="url(#cloth)" class="line" d="M102 396Q111 491 118 671l69 16 45-224z"/>
  <path fill="url(#cloth)" class="line" d="M398 396q102 95 95 275l-69 16-45-224z"/>
  <path fill="url(#skin)" class="line" d="M116 652q18-20 48-8l30 32-16 63q-57 6-72-28z"/>
  <path fill="url(#skin)" class="line" d="M384 652q-18-20-48-8l-30 32 16 63q57 6 72-28z"/>
</g>
<!-- torso and layered tunic -->
<path filter="url(#shadow)" fill="url(#cloth)" class="line" d="M77 371Q250 330 423 371L372 641Q250 670 128 641Z"/>
<path fill="url(#cloth2)" class="line" d="M118 616Q250 650 382 616L431 858Q250 913 69 858Z"/>
<path fill="#1f5561" opacity=".45" d="M95 389Q250 354 405 389L354 608Q250 632 146 608Z"/>
<!-- sash and ornament -->
<path fill="#1f5561" stroke="#241915" stroke-width="6" d="M85 399l42-24 189 264-48 31z"/>
<path fill="#e8b967" opacity=".35" d="M109 397l16-10 188 257-16 10z"/>
<path fill="#2e211b" stroke="#1b1310" stroke-width="6" d="M110 610Q250 638 390 610l8 52Q250 688 118 662Z"/>
<circle fill="url(#metal)" stroke="#3d2a1f" stroke-width="5" cx="250" cy="646" r="25"/>
<path fill="none" stroke="#fff1b2" stroke-width="5" d="M238 646l9 9 17-19"/>
<!-- pattern panel -->
<g class="pattern" clip-path="url(#torsoClip)"><path d="M188 558l18-22 18 22 18-22 18 22 18-22 18 22"/></g>
<!-- neck and head -->
<path fill="url(#skin)" class="line" d="M222 301h56l8 78q-36 33-72 0z"/>
<ellipse fill="url(#skin)" class="line" cx="250" cy="237" rx="74" ry="92"/>
<ellipse fill="url(#faceLight)" cx="250" cy="237" rx="69" ry="87"/>
<path fill="#1a1513" d="M204 238c-2-56 22-91 48-91 38 0 62 36 55 92-9-27-18-45-30-55l-8 67-10-70-12 72-10-69-15 58-9-50-9 46z"/>
<!-- face -->
<path fill="none" class="fine" d="M210 228q20-12 39 0M258 228q20-12 39 0"/>
<ellipse fill="#1d1714" cx="228" cy="242" rx="5" ry="7"/><ellipse fill="#1d1714" cx="275" cy="242" rx="5" ry="7"/>
<path fill="none" class="fine" d="M251 244l-4 31 14 3M226 297q25 18 51 0"/>
<path fill="#fff" opacity=".22" d="M206 194q22-34 50-35-32 18-42 57z"/>
<!-- collar and shoulder armor -->
<path fill="#1f5561" class="line" d="M206 338l44 38 44-38 25 60-69 43-69-43z"/>
<path fill="url(#metal)" class="fine" d="M72 370l62-24 17 65-73 20zM428 370l-62-24-17 65 73 20z"/>
<!-- highlights -->
<path fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="10" stroke-linecap="round" d="M166 430q-22 106-19 190M209 683q41 22 84 0M186 902q54 24 121 0"/>
<!-- accessory -->
<g class="accessory" filter="url(#shadow)" transform="rotate(-4 400 650)"><path stroke="#713021" stroke-width="15" stroke-linecap="round" d="M400 188v862"/><g fill="#e8b967" stroke="#3a2a1d" stroke-width="5"><circle cx="400" cy="175" r="21"/><circle cx="400" cy="175" r="8"/></g><path fill="none" stroke="#e8b967" stroke-width="6" d="M388 580h24M388 618h24"/></g>
<!-- foreground fabric tabs -->
<path fill="#bd5a36" class="line" d="M198 651l44 18-31 319-63 63z"/>
<path fill="#1f5561" class="line" d="M258 668l46-17 91 400-66-63z"/>
<path fill="#e8b967" opacity=".78" d="M208 681l15 6-28 269-17 18zM278 682l15-6 65 287-18-18z"/>
<!-- dust flecks -->
<g fill="#e8b967" opacity=".38"><circle cx="92" cy="1100" r="5"/><circle cx="116" cy="1073" r="3"/><circle cx="428" cy="1124" r="4"/><circle cx="451" cy="1089" r="6"/><circle cx="81" cy="1142" r="3"/></g>
</svg>